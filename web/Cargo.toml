[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
chip-8 = { path = "../chip-8" }
js-sys = "0.3.83"
rand = "0.8.5"
wasm-bindgen = "0.2.106"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false